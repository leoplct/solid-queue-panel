default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 5
      processes: 1
      polling_interval: 0.1
    - queues: [ mailers, reports ]
      threads: 2
      polling_interval: 0.5

development:
  <<: *default

test:
  <<: *default
